[package]
name = "cipher-cli"
version = "0.1.0"
edition = "2021"
description = "Cipher CLI — Send & receive E2EE messages from the terminal"

[[bin]]
name = "cipher-cli"
path = "src/main.rs"

[dependencies]
# Core Cipher library (identity, encryption, transport, messaging)
client-core = { path = "../client-core" }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Colored terminal output
colored = "3"

# Home directory detection
dirs = "6"

# Serialization (identity persistence)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.11"

# AES encryption for identity file
aes-gcm = "0.10"

# Password-based key derivation
sha2 = "0.10"

# Hex encoding
hex = "0.4"

# Random
rand = "0.8"

# Timestamp display
chrono = "0.4"

# HTTP client (for direct RPC calls in balance command)
ureq = { version = "2", features = ["json"] }

# Substrate storage hashing (for balance queries)
blake2 = "0.10"
twox-hash = "1.6"

# Optimize dependencies in debug mode (crypto is painfully slow without it)
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
